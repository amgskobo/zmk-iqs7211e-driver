# SPDX-License-Identifier: MIT
CONFIG_ZMK_BLE=n
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_MODE_THREAD=y
# The input thread and queue of a production pointer device.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=0
CONFIG_INPUT_QUEUE_MAX_MSGS=16
CONFIG_IQS7211E=y
CONFIG_PM_DEVICE=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_ASSERT=y
CONFIG_LOG_MODE_IMMEDIATE=y
# Virtual time: order and delays come from the kernel, not from host load.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
