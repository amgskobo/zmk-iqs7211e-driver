name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck host regression tests even without local changes.
    - cron: '0 2 * * 0'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Filter and fault-path coverage in pinned build image
        run: bash tests/run-host-docker.sh
