description: Azoteq IQS7211E trackpad zmk driver

compatible: "azoteq,iqs7211e"

include: i2c-device.yaml

properties:
  scroll-layers:
    type: array
    description: |
      Existing manual-scroll keymap layer IDs. The driver only watches these;
      it never activates or deactivates them. A contact that visits any listed
      layer is considered scrolling, so its tap and one delayed no-finger tap
      after deactivation are suppressed. The scroll-slider-layer is monitored
      in the same way automatically. Omit when no manual scroll layers exist.
  reg:
    required: true
    description: I2C address of the device
  irq-gpios:
    type: phandle-array
    required: true
    description: Interrupt pin
  single-tap:
    type: int
    default: -1
    description: |
      Set the button triggered by a single-tap.
      -1 = disabled, 0 = BTN_0, 1 = BTN_1, 2 = BTN_2
  double-tap:
    type: int
    default: -1
    description: |
      Set the button triggered by double-tap.
      -1 = disabled, 0 = BTN_0, 1 = BTN_1, 2 = BTN_2
  triple-tap:
    type: int
    default: -1
    description: |
      Set the button triggered by triple-tap.
      -1 = disabled, 0 = BTN_0, 1 = BTN_1, 2 = BTN_2
  scroll-slider-layer:
    type: int
    default: -1
    description: |
      Driver-owned layer activated while the right-edge scroll slider is touched.
      -1 = disabled, otherwise an existing keymap layer ID. This must be a
      driver-exclusive layer: do not also activate it from a key binding,
      macro, or other behavior.
  scroll-start:
    type: int
    default: 40
    description: |
      Padding from the right edge used to detect the scroll slider area.
      The normalized coordinate range is 0-1024 inclusive.
  scroll-slider-trigger-layers:
    type: array
    description: |
      Restrict automatic scroll-slider-layer activation to these highest active layers.
      If omitted, automatic slider activation is allowed on any layer.
      This does not change the target scroll-slider-layer; it only controls which
      layers may trigger it. Values are existing keymap layer IDs, not layer
      order indexes.
  rotate-cw:
    type: int
    default: 0
    enum:
      - 0
      - 1
      - 2
      - 3
    description: |
      Clockwise rotation applied to every reported coordinate, to match how the
      module is physically mounted. The scroll slider edge follows it, so there
      is no separate setting for that.
      0 = 0 deg, 1 = 90 deg, 2 = 180 deg, 3 = 270 deg
  report-abs:
    type: boolean
    description: |
      If true, report absolute coordinates instead of relative ones. If omitted,
      the driver reports relative coordinates directly.
  jitter-deadband:
    type: int
    default: 8
    description: |
      Maximum per-axis coordinate distance held by the rubber-band jitter gate
      before motion is reported. This is applied independently to X and Y, not
      as a Euclidean radius. The three-sample median filter remains active when
      this is 0. The default of 8 is a conservative starting point for the
      Trackpad01 panel; override it from the board overlay when measurements
      show a different stationary-jitter/fine-motion boundary. The normalized
      coordinate range is 0-1024 inclusive.
  touch-verify-interval-ms:
    type: int
    default: 120
    description: |
      While a touch remains active, run a full report read at this interval to
      verify that the physical touch is still present. This applies equally to
      absolute and relative reporting so both modes observe the same touch
      samples and release timing. If the read fails or no fingers are present, report touch
      release and stop verification. Set to 0 to disable host verification
      and retain the sensor's 60-second Idle-Touch fallback.
